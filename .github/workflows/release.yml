name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Validate frontend
        run: npm run check

      - name: Validate Rust
        working-directory: src-tauri
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets

      - name: Build Tauri bundles
        run: npm run build:tauri:signed
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Generate latest.json
        run: node scripts/generate-latest-json.mjs

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: src-tauri/target/release/bundle
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows bundle
        uses: actions/download-artifact@v4
        with:
          name: bundle-windows-latest
          path: artifacts/windows

      - name: Download Linux bundle
        uses: actions/download-artifact@v4
        with:
          name: bundle-ubuntu-latest
          path: artifacts/linux

      - name: Merge latest.json
        run: |
          node scripts/merge-latest-json.mjs \
            artifacts/latest.json \
            artifacts/windows/nsis/latest.json \
            artifacts/linux/appimage/latest.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v$version"

          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Le tag $GITHUB_REF_NAME ne correspond pas à la version $version." >&2
            exit 1
          fi

          exe="artifacts/windows/nsis/ZkPlayer Desktop_${version}_x64-setup.exe"
          sig="$exe.sig"
          msi="artifacts/windows/msi/ZkPlayer Desktop_${version}_x64_en-US.msi"
          msi_sig="$msi.sig"
          appimage="artifacts/linux/appimage/ZkPlayer Desktop_${version}_amd64.AppImage"
          appimage_sig="$appimage.sig"
          deb="artifacts/linux/deb/ZkPlayer Desktop_${version}_amd64.deb"
          notes="artifacts/windows/nsis/release-notes.md"
          latest="artifacts/latest.json"

          for f in "$exe" "$sig" "$msi" "$msi_sig" "$appimage" "$appimage_sig" "$deb" "$notes" "$latest"; do
            if [ ! -f "$f" ]; then
              echo "Artefact de release manquant : $f" >&2
              exit 1
            fi
          done

          echo "Artefacts validés :"
          ls -la "$exe" "$sig" "$msi" "$msi_sig" "$appimage" "$appimage_sig" "$deb" "$latest"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Updating notes and assets..."
            gh release edit "$tag" \
              --title "ZkPlayer Desktop $tag" \
              --notes-file "$notes"
            gh release upload "$tag" "$exe" "$sig" "$msi" "$msi_sig" "$appimage" "$appimage_sig" "$deb" "$latest" --clobber
          else
            gh release create "$tag" \
              --title "ZkPlayer Desktop $tag" \
              --notes-file "$notes" \
              "$exe" "$sig" "$msi" "$msi_sig" "$appimage" "$appimage_sig" "$deb" "$latest"
          fi
