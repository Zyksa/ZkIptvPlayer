[package]
name = "zkplayer-desktop"
version = "1.1.0"
description = "Native Windows IPTV & VOD Player built with Rust and Tauri 2.0"
authors = ["ZkPlayer Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = [] }
tauri-plugin-updater = "=2.3.0"
tauri-plugin-process = "=2.2.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["stream"] }
tokio = { version = "1.38", features = ["fs", "io-util", "net", "process", "rt", "sync"] }
urlencoding = "2.1"
dirs = "6.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
